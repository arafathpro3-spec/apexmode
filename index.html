<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APEX MODE & STOCK</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F3F86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#F3F4F7;--card:#fff;--ink:#1B2340;--mut:#68708F;--line:#DADEE9;--pri:#2F3F86;--onpri:#fff;--acc:#E8A317;--ok:#2E7D5B;--bad:#C0392B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10142A;--card:#1A2040;--ink:#EEF0F8;--mut:#9AA3C7;--line:#2B3361;--pri:#8E9BEA;--onpri:#10142A;--acc:#F0B63A;--ok:#4FB58A;--bad:#E26A5C}}
:root[data-theme="dark"]{--bg:#10142A;--card:#1A2040;--ink:#EEF0F8;--mut:#9AA3C7;--line:#2B3361;--pri:#8E9BEA;--onpri:#10142A;--acc:#F0B63A;--ok:#4FB58A;--bad:#E26A5C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
header{background:var(--brand,var(--pri));color:var(--onbrand,var(--onpri));padding:14px 16px}
header b{font-size:19px;letter-spacing:.3px}header span{opacity:.8;font-size:13px;margin-left:8px}
main{max-width:920px;margin:0 auto;padding:14px}
h2{font-size:17px;margin:18px 0 8px}h3{font-size:15px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border-left:4px solid var(--acc)}.kpi small{color:var(--mut);display:block}.kpi b{font-size:21px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.mut{color:var(--mut);font-size:13px}
button,.btn{font:inherit;border:1px solid var(--pri);background:var(--pri);color:var(--onpri);border-radius:8px;padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-block}
button.alt,.btn.alt{background:transparent;color:var(--pri)}
button.wa,.btn.wa{background:#25a244;border-color:#25a244;color:#fff}
button.del{background:transparent;color:var(--bad);border-color:var(--bad)}
button.sm,.btn.sm{padding:4px 9px;font-size:13px}
input,select,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:480px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--mut);font-weight:600}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--line)}
.low{background:var(--bad);color:#fff}.okq{background:var(--ok);color:#fff}
.bar{height:8px;background:var(--acc);border-radius:4px;margin-top:3px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);border-radius:0;padding:10px 2px;font-size:12px}
nav button.on{color:var(--pri);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(440px,94vw);padding:16px;max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(10,14,40,.55)}
.empty{text-align:center;color:var(--mut);padding:22px}
header button,header button.alt{background:transparent;color:var(--onbrand,var(--onpri));border-color:var(--onbrand,var(--onpri))}header span{margin-left:0}
#login{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}#login[hidden]{display:none}#login .card{width:min(380px,100%)}#lm{color:var(--bad);min-height:20px;font-size:13px;margin:8px 0 0}
@media print{body>*:not(dialog){display:none!important}dialog{position:static!important;width:100%!important;border:0!important;max-height:none!important}.noprint{display:none!important}}
#lock{position:fixed;inset:0;background:var(--bg);z-index:19;display:flex;align-items:center;justify-content:center;padding:16px}#lock[hidden]{display:none}#lock .card{width:min(420px,100%)}nav button{font-size:11px}
</style></head><body>
<header class="row"><b>APEX MODE & STOCK</b><span class="sp" id="st"></span><button id="out" class="sm alt" hidden>Déconnexion</button></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="lock" hidden></div>
<input type="file" id="imp" accept=".csv,.xlsx,.xls,.txt" hidden>
<input type="file" id="bkf" accept=".json" hidden>
<dialog id="dlg"></dialog>
<div id="login"><div class="card"><h3 style="font-size:19px">APEX MODE & STOCK</h3><div class="mut">Connectez-vous pour retrouver vos données sur tous vos appareils.</div><label>Email</label><input id="le" type="email" autocomplete="username"><label>Mot de passe</label><input id="lp" type="password" autocomplete="current-password"><label>Code d'invitation (si vous êtes employé)</label><input id="lc" placeholder="Laissez vide si vous êtes le propriétaire" autocapitalize="characters" autocomplete="off"><p id="lm"></p><div class="row" style="margin-top:8px"><button id="li">Se connecter</button><button id="ln" class="alt">Créer le compte</button></div><button id="lr" class="sm alt" style="margin-top:10px">Mot de passe oublié</button><div class="mut" style="margin-top:12px;font-size:12px">Version 12</div></div></div>
<script>
const S={p:[],m:[],s:[],c:[],pm:[],sup:[],shop:{},lic:null,adm:[],isAdm:false,em:'',role:'owner',who:'',team:[],inv:[],act:[],bk:[]};
const logA=(k,t)=>{try{window.logAct&&window.logAct(k,t)}catch(e){}};
const seenT=()=>{try{return +localStorage.getItem('apex_seen')||0}catch(e){return 0}};
const PREM=['invoice','wa','debts','reports','suppliers','hist','notif','brand','backup','cat'];
function acc(){
  if(S.isAdm||S.demo)return {ok:true,plan:'premium',left:999,end:Date.now()+9e10};
  const l=S.lic;if(!l||!l.plan)return {ok:true,plan:'trial',left:7,loading:true};
  const now=Date.now();
  if(l.plan=='trial'){const e=(l.start||now)+7*864e5;return {ok:now<e,plan:'trial',left:Math.max(0,Math.ceil((e-now)/864e5)),end:e}}
  const e=l.until||0;return {ok:now<e,plan:l.plan,left:Math.max(0,Math.ceil((e-now)/864e5)),end:e};
}
const can=f=>acc().plan=='premium'||!PREM.includes(f);
const up=t=>`<div class="card" style="border-color:var(--acc)"><b>${t}</b> : fonction du plan Premium (15 000 F/mois).${S.role=='seller'?'':`<br><button class="sm" style="margin-top:8px" onclick="go('shop')">Voir les abonnements</button>`}</div>`;
const wal=p=>`https://wa.me/${(window.APEX||{}).contact||''}?text=`+encodeURIComponent(`Bonjour, je souhaite activer APEX MODE (${p}) pour ma boutique « ${S.shop.name||''} » (${S.em}).`);
const trialBar=()=>{if(S.role=='seller')return '';const a=acc();if(a.loading||!a.ok)return '';
  if(a.plan=='trial')return `<div class="card" style="border-color:var(--acc)">Essai gratuit : <b>${a.left} jour(s)</b> restant(s). <button class="sm alt" onclick="go('shop')">Voir les abonnements</button></div>`;
  return a.left<=7?`<div class="card" style="border-color:var(--acc)">Votre abonnement expire dans <b>${a.left} jour(s)</b>. <a class="btn wa sm" target="_blank" rel="noopener" href="${wal('renouvellement '+a.plan)}">Renouveler</a></div>`:''};
function lockUI(){
  const a=acc(),el=$('#lock'),on=!a.ok&&!a.loading&&!S.isAdm;el.hidden=!on;if(!on)return;
  if(S.role=='seller'){el.innerHTML=`<div class="card"><h3>Abonnement expiré</h3><div class="mut">L'abonnement de la boutique est expiré. Prévenez le propriétaire pour qu'il le renouvelle.</div><div class="row" style="margin-top:12px"><button class="sm alt" onclick="$('#out').click()">Déconnexion</button></div></div>`;return}
  el.innerHTML=`<div class="card"><h3>${a.plan=='trial'?'Essai gratuit terminé':'Abonnement expiré'}</h3><div class="mut">Choisissez Standard (8 000 F/mois) ou Premium (15 000 F/mois) pour continuer. Vos données sont conservées.</div>
  <div class="row" style="margin-top:12px"><a class="btn wa" target="_blank" rel="noopener" href="${wal('Standard')}">Activer Standard</a><a class="btn wa" target="_blank" rel="noopener" href="${wal('Premium')}">Activer Premium</a></div>
  <div class="row" style="margin-top:12px"><button class="sm alt" onclick="exp('ventes',true)">Exporter mes ventes</button><button class="sm alt" onclick="exp('stock')">Exporter le stock</button><button class="sm alt" onclick="$('#out').click()">Déconnexion</button></div></div>`;
}
const save=()=>{window.cloudSave&&window.cloudSave()};
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const F=n=>Math.round(n||0).toLocaleString('fr-FR')+' F';
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stock=id=>S.m.filter(x=>x.pid==id).reduce((a,x)=>a+(x.t=='in'?x.q:-x.q),0);
const prod=id=>S.p.find(x=>x.id==id);
const cli=id=>S.c.find(x=>x.id==id);
const pn=p=>p?`${p.ref} – ${p.type||''} ${p.color||''}${p.pat?' '+p.pat:''}`.replace(/\s+/g,' ').trim():'(supprimé)';
const UN=[['m','Mètre (m)'],['pce','Pièce'],['paire','Paire'],['lot','Lot / ensemble']];
const un=p=>(p&&p.u)||'m';
const Q=(q,p)=>q+' '+un(p);
const cn=p=>[p.type,p.color,p.pat].filter(Boolean).join(' ')||p.ref;
const unitsLbl=()=>S.p.length&&S.p.every(p=>un(p)=='m')?'m':'unités';
const fd=d=>new Date(d+'T12:00').toLocaleDateString('fr-FR');
let view='home',cid=null,rp={mode:'day',date:today()};
const TABS=[['home','Accueil'],['stock','Stock'],['sales','Ventes'],['clients','Clients'],['rep','Rapports'],['shop','Boutique']];

/* ---------- formulaires ---------- */
function form(title,fields,ok,extra){
  const d=$('#dlg');
  d.innerHTML=`<h3>${title}</h3>${fields.map(f=>`<label>${f.l}</label>`+(f.o?`<select id="f_${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}"${o[0]==f.v?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`:f.t=='area'?`<textarea id="f_${f.k}" rows="2">${esc(f.v||'')}</textarea>`:f.t=='img'?`<input type="hidden" id="f_${f.k}" value="${esc(f.v||'')}"><div class="row"><img id="pv_${f.k}" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:10px;background:var(--bd,#ddd)${f.v?'':';display:none'}" ${f.v?`src="${esc(f.v)}"`:''}><input type="file" accept="image/*" id="fi_${f.k}" style="flex:1;min-width:0"><button type="button" class="sm alt" id="fx_${f.k}">Retirer</button></div>`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${esc(f.v??'')}" ${f.t=='number'?'step="any" min="0"':''}>`)).join('')}
  <div class="row" style="margin-top:14px"><button class="alt" id="fc">Annuler</button><span class="sp"></span><button id="fo">Enregistrer</button></div>`;
  d.showModal();
  $('#fc').onclick=()=>d.close();
  fields.filter(f=>f.t=='img').forEach(f=>{
    $('#fi_'+f.k).onchange=async e=>{const fl=e.target.files[0];if(!fl)return;try{const u=await shrink(fl);$('#f_'+f.k).value=u;const im=$('#pv_'+f.k);im.src=u;im.style.display=''}catch(x){alert("Photo illisible : "+x.message)}};
    $('#fx_'+f.k).onclick=()=>{$('#f_'+f.k).value='';$('#pv_'+f.k).style.display='none';$('#fi_'+f.k).value=''};
  });
  if(extra)extra();
  $('#fo').onclick=()=>{const v={};fields.forEach(f=>v[f.k]=$('#f_'+f.k).value);if(ok(v)!==false)d.close();};
}
const num=x=>parseFloat(String(x).replace(',','.'))||0;
function shrink(file,max=480,qual=.68){return new Promise((ok,ko)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{try{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',qual))}catch(e){ko(e)}};im.onerror=()=>{URL.revokeObjectURL(u);ko(new Error('format non reconnu'))};im.src=u})}

/* ---------- stock ---------- */
function prodForm(p){
  const n=!p;
  const cats=[...new Set(S.p.map(x=>x.cat).filter(Boolean))];
  form(n?'Nouvel article':"Modifier l'article",[
    {k:'ref',l:'Référence',v:p?.ref},{k:'type',l:'Désignation (jean, brassière, ensemble, wax, bazin…)',v:p?.type},
    {k:'cat',l:'Catégorie'+(cats.length?' (ex. '+cats.slice(0,4).join(', ')+')':' (ex. Jeans, Crop tops, Tissus)'),v:p?.cat},
    {k:'color',l:'Couleur',v:p?.color},{k:'pat',l:'Motif / matière (facultatif)',v:p?.pat},
    {k:'u',l:'Vendu par',o:UN,v:p?.u||'m'},
    {k:'sz',l:'Tailles disponibles (ex. S, M, L, XL — facultatif)',v:p?.sz},
    ...(S.role=='seller'?[]:[{k:'buy',l:"Prix d'achat unitaire (F)",t:'number',v:p?.buy}]),{k:'sell',l:'Prix de vente unitaire (F)',t:'number',v:p?.sell},
    {k:'min',l:"Alerte quand le stock est à cette quantité ou moins",t:'number',v:p?.min??5},
    {k:'desc',l:'Description pour le catalogue (facultatif)',t:'area',v:p?.desc},
    {k:'img',l:'Photo (facultatif)',t:'img',v:p?.img},
    {k:'pub',l:'Afficher dans le catalogue en ligne',o:[['1','Oui'],['0','Non']],v:p&&p.pub===false?'0':'1'},
    ...(n?[{k:'q',l:'Quantité en stock au départ',t:'number',v:0}]:[])
  ],v=>{
    if(!v.ref.trim()){alert('Indiquez une référence.');return false}
    const o={ref:v.ref.trim(),type:v.type.trim(),cat:v.cat.trim(),color:v.color.trim(),pat:v.pat.trim(),u:v.u,sz:v.sz.trim(),desc:v.desc.trim(),img:v.img||'',pub:v.pub!='0',buy:num(v.buy),sell:num(v.sell),min:num(v.min)};if(S.role=='seller')delete o.buy;
    if(n){o.id=uid();S.p.push(o);if(num(v.q)>0)S.m.push({id:uid(),pid:o.id,t:'in',q:num(v.q),d:today(),n:'Stock de départ'})}
    else Object.assign(p,o);
    save();render();
  });
}
function moveForm(p,t){
  form((t=='in'?'Entrée : ':'Sortie : ')+pn(p),[
    {k:'q',l:'Quantité ('+un(p)+')',t:'number'},{k:'d',l:'Date',t:'date',v:today()},...(t=='in'&&can('suppliers')&&S.sup.length?[{k:'fo',l:'Fournisseur',o:[['','—'],...S.sup.map(x=>[x.id,x.name])]}]:[]),{k:'n',l:t=='in'?'Note':'Motif (coupe, perte…)'}
  ],v=>{
    const q=num(v.q);if(q<=0){alert('Indiquez une quantité.');return false}
    if(t=='out'&&q>stock(p.id)&&!confirm('Cette sortie dépasse le stock. Continuer ?'))return false;
    const fo=S.sup.find(x=>x.id==v.fo);S.m.push({id:uid(),pid:p.id,t,q,d:v.d,n:(fo?fo.name+' – ':'')+(v.n||'')});logA(t,'a enregistré '+(t=='in'?'une entrée':'une sortie')+' de '+Q(q,p)+' : '+pn(p));save();render();
  });
}
function vStock(){
  const q=(window._q||'').toLowerCase();
  const L=S.p.filter(p=>(pn(p)+' '+(p.cat||'')).toLowerCase().includes(q));
  return `<div class="row"><input id="sq" placeholder="Chercher un article" value="${esc(window._q||'')}" style="flex:1;min-width:140px"><button onclick="prodForm()">Ajouter un article</button>${S.role=='seller'?'':`<button class="alt" onclick="catDlg()">Catalogue en ligne</button>`}<button class="alt" onclick="exp('stock')">Exporter (CSV)</button><button class="alt" onclick="$('#imp').click()">Importer</button><button class="alt" onclick="exp('modele')">Modèle</button></div>
  <div style="height:10px"></div>`+(L.length?L.map(p=>{const s=stock(p.id),low=s<=p.min;return `<div class="card"><div class="row">${p.img?`<img src="${esc(p.img)}" alt="" style="width:52px;height:52px;object-fit:cover;border-radius:10px">`:''}<div class="sp"><b>${esc(pn(p))}</b>${p.cat?`<div class="mut">${esc(p.cat)}${p.sz?' – '+esc(p.sz):''}</div>`:''}</div><span class="tag ${low?'low':'okq'}">${Q(s,p)}</span></div>
  <div class="mut">${S.role=='seller'?'':'Achat '+F(p.buy)+'/'+un(p)+' – '}Vente ${F(p.sell)}/${un(p)}${low?' – Presque épuisé':''}</div>
  <div class="row" style="margin-top:8px"><button class="sm" onclick="moveForm(prod('${p.id}'),'in')">Entrée</button><button class="sm alt" onclick="moveForm(prod('${p.id}'),'out')">Sortie</button><button class="sm alt" onclick="prodForm(prod('${p.id}'))">Modifier</button><button class="sm alt" onclick="hf.pid='${p.id}';go('hist')">Historique</button><button class="sm del" onclick="delProd('${p.id}')">Supprimer</button></div></div>`}).join(''):`<div class="empty">Aucun article. Ajoutez votre premier article pour commencer.<br><br><button class="alt" onclick="seed()">Charger des exemples</button></div>`)
  +(S.m.length?`<div class="row"><h2>Derniers mouvements</h2><span class="sp"></span><button class="sm alt" onclick="go('hist')">Historique détaillé</button></div><div class="card tw"><table><tr><th>Date</th><th>Article</th><th>Mouvement</th><th>Note</th></tr>${[...S.m].reverse().slice(0,15).map(m=>`<tr><td>${fd(m.d)}</td><td>${esc(pn(prod(m.pid)))}</td><td>${m.t=='in'?'+':'−'}${Q(m.q,prod(m.pid))}</td><td>${esc(m.n||'')}</td></tr>`).join('')}</table></div>`:'')+vSup();
}
function delProd(id){if(confirm('Supprimer cet article et ses mouvements ?')){logA('del','a supprimé l\'article '+pn(prod(id)));S.p=S.p.filter(p=>p.id!=id);S.m=S.m.filter(m=>m.pid!=id);save();render()}}

/* ---------- ventes ---------- */
function invNo(d){const ym=d.slice(2,4)+d.slice(5,7);const n=new Set(S.s.filter(s=>s.no&&s.no.startsWith('F-'+ym)).map(s=>s.no)).size+1;return `F-${ym}-${String(n).padStart(3,'0')}`}
function saleForm(pre){
  pre=pre||{};
  if(!S.p.length){alert("Ajoutez d'abord un article dans l'onglet Stock.");return}
  form(pre.no?'Ajouter un article à '+pre.no:'Nouvelle vente',[
    {k:'pid',l:'Article',o:S.p.map(p=>[p.id,`${pn(p)} (${Q(stock(p.id),p)})`])},
    {k:'q',l:'Quantité vendue',t:'number',v:1},{k:'pr',l:'Prix unitaire (F)',t:'number',v:S.p[0].sell},
    ...(pre.no?[]:[{k:'cid',l:'Client',o:[['','Client de passage'],...S.c.map(c=>[c.id,c.name])]},
    {k:'pay',l:'Mode de paiement',o:['Espèces','Mobile Money','Virement',...(can('debts')?['À crédit']:[])].map(x=>[x,x])},
    ...(can('debts')?[{k:'ac',l:'Acompte versé si paiement à crédit (F)',t:'number',v:0}]:[]),
    {k:'d',l:'Date',t:'date',v:today()}])
  ],v=>{
    const q=num(v.q);if(q<=0){alert('Indiquez une quantité.');return false}
    if(q>stock(v.pid)&&!confirm('Stock insuffisant pour cette vente. Enregistrer quand même ?'))return false;
    const pay0=pre.no?pre.pay:v.pay;if(pay0=='À crédit'&&!(pre.no?pre.cid:v.cid)){alert('Choisissez un client pour une vente à crédit.');return false}
    const d=pre.no?pre.d:v.d,no=pre.no||invNo(d),id=uid();if(!pre.no&&pay0=='À crédit'&&num(v.ac)>0)S.pm.push({id:uid(),no,cid:v.cid,amt:num(v.ac),d,mode:'Acompte'});
    S.s.push({id,d,pid:v.pid,q,pr:num(v.pr),cid:pre.no?pre.cid:v.cid,pay:pre.no?pre.pay:v.pay,no});
    S.m.push({id:uid(),pid:v.pid,t:'out',q,d,n:'Vente '+no,sid:id});logA('sale','a enregistré la vente '+no+' ('+Q(q,prod(v.pid))+', '+pn(prod(v.pid))+')');save();render();
    setTimeout(()=>invoice(no),50);
  },()=>{$('#f_pid').onchange=e=>{$('#f_pr').value=prod(e.target.value).sell}});
}
const tot=s=>s.q*s.pr;

const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const AL={ref:['reference','ref','code'],type:['type','designation','article','nom','nature'],cat:['categorie','category','rayon'],u:['unite','vendupar'],sz:['tailles','taille'],desc:['description'],color:['couleur','color'],pat:['motif','pattern','dessin'],q:['stockm','stock','quantite','qte','stockactuel'],buy:['prixachat','achat','pa'],sell:['prixvente','vente','pv','prix'],min:['seuilalerte','seuil','alerte','stockminimum']};
function parseCSV(t){
  t=t.replace(/^\ufeff/,'');const first=t.split(/\r?\n/)[0];
  const d=[';','\t',','].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const R=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;else if(ch==d){r.push(c);c=''}
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';R.push(r);r=[]}else c+=ch}
  if(c!==''||r.length){r.push(c);R.push(r)}
  return R.filter(x=>x.some(v=>String(v).trim()!==''));
}
const loadScript=u=>new Promise((ok,ko)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=()=>ko(new Error('chargement du lecteur Excel impossible (connexion ?)'));document.head.appendChild(e)});
async function readFile(f){
  if(/\.(xlsx|xls)$/i.test(f.name)){
    if(!window.XLSX)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
  }
  return parseCSV(await f.text());
}
async function importFile(f){
  try{
    const R=await readFile(f);if(R.length<2){alert('Fichier vide.');return}
    const H=R[0].map(norm),ix={};for(const k in AL)ix[k]=H.findIndex(h=>AL[k].includes(h));
    if(ix.ref<0){alert('Colonne « Référence » introuvable. Utilisez le bouton Modèle.');return}
    const n=x=>num(String(x).replace(/\s/g,'')),items=[];
    R.slice(1).forEach(r=>{const g=k=>ix[k]>=0?String(r[ix[k]]??'').trim():'';const ref=g('ref');if(!ref)return;
      items.push({ref,type:g('type'),cat:g('cat'),u:({m:'m',metre:'m',metres:'m',pce:'pce',piece:'pce',pieces:'pce',paire:'paire',paires:'paire',lot:'lot',ensemble:'lot'})[norm(g('u'))]||'',sz:g('sz'),desc:g('desc'),color:g('color'),pat:g('pat'),buy:S.role=='seller'?0:n(g('buy')),sell:n(g('sell')),min:g('min')!==''?n(g('min')):5,q:n(g('q'))})});
    if(!items.length){alert('Aucune ligne valide.');return}
    const upd=items.filter(it=>S.p.some(p=>p.ref==it.ref)).length;
    if(!confirm(`Importer ${items.length} ligne(s) : ${items.length-upd} nouvel(s) article(s), ${upd} mis à jour (infos et prix, stock inchangé) ?`))return;
    items.forEach(it=>{const e=S.p.find(p=>p.ref==it.ref);
      if(e)Object.assign(e,{type:it.type||e.type,cat:it.cat||e.cat,u:it.u||e.u,sz:it.sz||e.sz,desc:it.desc||e.desc,color:it.color||e.color,pat:it.pat||e.pat,buy:it.buy||e.buy,sell:it.sell||e.sell,min:it.min});
      else{const id=uid();S.p.push({id,ref:it.ref,type:it.type,cat:it.cat,u:it.u||'m',sz:it.sz,desc:it.desc,pub:true,color:it.color,pat:it.pat,buy:it.buy,sell:it.sell,min:it.min});if(it.q>0)S.m.push({id:uid(),pid:id,t:'in',q:it.q,d:today(),n:'Import'})}});
    save();render();alert('Import terminé.');
  }catch(e){alert('Import impossible : '+e.message)}
}

const b64=u=>{let t='';for(let i=0;i<u.length;i+=8192)t+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(t)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function enc(str){
  const u=new TextEncoder().encode(str);
  if(window.CompressionStream){const r=new Blob([u]).stream().pipeThrough(new CompressionStream('gzip'));return 'g'+b64(new Uint8Array(await new Response(r).arrayBuffer()))}
  return 'r'+b64(u);
}
async function dec(t){
  const u=unb64(t.slice(1));
  if(t[0]=='g'){const r=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));return new TextDecoder().decode(await new Response(r).arrayBuffer())}
  return new TextDecoder().decode(u);
}
const bkPack=()=>({v:1,t:Date.now(),shop:S.shop,p:S.p,m:S.m,s:S.s,c:S.c,pm:S.pm,sup:S.sup});
async function makeBackup(kind){

  for(let i=0;i<b.length;i+=600000)ch.push(b.slice(i,i+600000));
  const id=(kind=='auto'?'a_'+today():(kind=='before'?'r_':'m_')+Date.now());
  const meta={id,t:o.t,kind,n:ch.length,size:b.length,counts:{p:S.p.length,s:S.s.length,c:S.c.length,m:S.m.length}};
  await window.bkPut(meta,ch);
  const old=[meta,...S.bk.filter(x=>x.id!=id)].sort((x,y)=>y.t-x.t).slice(20).map(x=>x.id);
  if(old.length)await window.bkDel(old);
  return meta;
}

  try{
    if(plan=='off'){if(confirm('Suspendre cette boutique ?'))await setDoc(doc(db,'licenses',id),{plan:'standard',until:Timestamp.fromMillis(Date.now()-1000)},{merge:true});return}
    const PR={standard:{1:8000,12:96000},premium:{1:15000,12:180000}};
    if(!confirm('Activer '+plan+' pour '+months+' mois ('+PR[plan][months]+' F) : '+(l.name||l.email)+' ?'))return;
    const cur=l.until&&l.until.toMillis?l.until.toMillis():0,d=new Date(Math.max(Date.now(),cur));d.setMonth(d.getMonth()+months);
    await setDoc(doc(db,'licenses',id),{plan,until:Timestamp.fromDate(d),hist:[...(l.hist||[]),{t:Date.now(),plan,months,amt:PR[plan][months]}]},{merge:true});
  }catch(e){alert('Action refusée ('+(e.code||e.message)+'). Vérifiez adminUid et les règles Firestore.')}
};
async function claim(u,code){
  const iv=await getDoc(doc(db,'invites',code));if(!iv.exists())throw {code:'invite'};
  const d=iv.data(),mem={shopId:d.shopId,role:'seller',active:true,name:d.name||'',email:u.email||'',code};
  const b=writeBatch(db);b.set(doc(db,'memberships',u.uid),mem);b.set(doc(db,'usedCodes',code),{uid:u.uid});await b.commit();return mem;
}
const run=async f=>{lm.textContent='';pendingCode=($('#lc').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');try{await f(auth,$('#le').value.trim(),$('#lp').value)}catch(x){pendingCode='';lm.textContent=MSG[x.code]||('Erreur : '+(x.code||x.message))}};
$('#li').onclick=()=>run(signInWithEmailAndPassword);
$('#ln').onclick=()=>run(createUserWithEmailAndPassword);
$('#lr').onclick=()=>run(async(a,m)=>{if(!m)throw{code:'auth/invalid-email'};await sendPasswordResetEmail(a,m);lm.textContent='Email de réinitialisation envoyé.'});
$('#out').onclick=()=>{if(confirm('Se déconnecter ?'))signOut(auth)};
onAuthStateChanged(auth,async u=>{
  unsubs.forEach(f=>f());unsubs=[];const g=++gen;
  if(!u){me=null;sid=null;role='owner';KS.forEach(k=>S[k]=[]);Object.keys(S.shop).forEach(x=>delete S.shop[x]);S.lic=null;S.adm=[];S.isAdm=false;S.em='';S.role='owner';S.team=[];S.inv=[];S.act=[];S.bk=[];S.dataReady=false;S.bkSnap=false;$('#login').hidden=false;$('#out').hidden=true;status();render();return}
  let mem=null;const ck='apex_role_'+u.uid;
  try{const r=await getDoc(doc(db,'memberships',u.uid));if(r.exists()&&r.data().active)mem=r.data();try{localStorage.setItem(ck,mem?JSON.stringify(mem):'owner')}catch(e){}}
  catch(e){if(e&&e.code=='permission-denied'){lm.textContent=MSG.rules;await signOut(auth);return}
    let c=null;try{c=localStorage.getItem(ck)}catch(x){}
    if(c==null){lm.textContent=MSG.net;await signOut(auth);return}
    mem=c=='owner'?null:JSON.parse(c)}
  if(!mem&&pendingCode){try{mem=await claim(u,pendingCode);try{localStorage.setItem(ck,JSON.stringify(mem))}catch(e){}}catch(e){pendingCode='';lm.textContent=MSG.invite;await signOut(auth);return}}
  pendingCode='';
  if(g!==gen)return;
  role=mem?'seller':'owner';sid=mem?mem.shopId:u.uid;S.who=mem?(mem.name||u.email):'Propriétaire';
  $('#login').hidden=true;$('#out').hidden=false;listen(u.uid);
});
}
